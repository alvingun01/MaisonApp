<body>
  <!-- TOAST -->
  <div class="toast-container">
    <div class="toast" id="toast">
      <span class="toast__icon" id="toast-icon">✓</span>
      <span id="toast-message"></span>
    </div>
  </div>

  <main>
    <!-- PAGE HERO -->
    <div class="page-hero">
      <div class="page-hero__eyebrow">The Full Collection</div>
      <h1 class="page-hero__title">Our <em>Catalog</em></h1>
      <p class="page-hero__sub">
        {{products.length}} objects, thoughtfully gathered.
      </p>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <div class="filter-bar__inner" id="filter-bar">
        <button class="filter-btn" ng-class="{'filter-btn--active': selectedCategory === 'All'}"
          ng-click="changeFilter('All')" data-category="All">
          All
        </button>
        <button ng-repeat="category in categories" class="filter-btn"
          ng-class="{'filter-btn--active': selectedCategory === category}" ng-click="changeFilter(category)"
          data-category="{{category}}">{{category}}</button>

        <div class="filter-sort">
          <span>Sort:</span>
          <select ng-model="sortBy" ng-change="updateSort()">
            <option value="default">Featured</option>
            <option value="price-asc">Price: Low–High</option>
            <option value="price-desc">Price: High–Low</option>
            <option value="rating">Top Rated</option>
            <option value="reviews">Most Reviewed</option>
          </select>
        </div>
      </div>
    </div>

    <!-- SEARCH -->
    <div style="max-width: 1300px; margin: 0 auto; padding: 1.5rem 2.5rem 0">
      <input class="form-control" style="max-width: 380px" type="text" ng-model="searchTerm"
        placeholder="Search objects…" />
    </div>

    <!-- PRODUCT GRID -->
    <div style="max-width: 1300px; margin: 0 auto; padding: 2rem 2.5rem">
      <div class="product-grid product-grid--3" id="catalog-grid">
        <product-card
          ng-repeat="product in filteredProducts = (products | filter: applyFilter | orderBy: sortPredicate : sortReverse)"
          product="product" add-to-cart="addToCart(product)" add-to-wishlist="addToWishlist(product)"></product-card>

        <!-- EMPTY STATE (hidden by default, shown by JS) -->
        <div class="empty-state" ng-if="filteredProducts.length === 0">
          <div class="empty-state__glyph">◌</div>
          <div class="empty-state__title">Nothing found</div>
          <p class="empty-state__sub">
            Try a different category or clear your search.
          </p>
        </div>
      </div>
      <!-- /wrapper -->
  </main>


  <script src="js/app.js"></script>
</body>

</html>
